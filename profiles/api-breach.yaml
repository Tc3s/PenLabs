# PenLabs — API-BREACH Profile

profile:
  name: api-breach
  description: "Origin/API exposure — origin finder, hidden params, API misconfig and exposure"
  author: PenLabs
  version: "1.0"
  tactical_mode: "api-breach"

pipeline:
  - step: origin_discovery
    tool: origin-finder
    enabled: true
    config:
      passive_first: true

  - step: web_probe
    tool: httpx
    enabled: true
    config:
      follow_redirects: true
      tech_detect: true
      status_code: true

  - step: crawl
    tool: katana
    enabled: true
    config:
      max_depth: 4
      js_crawl: true
      headless: false

  - step: api_discovery
    tool: arjun
    enabled: true
    config:
      max_endpoints: 20

  - step: vuln_scan
    tool: nuclei
    enabled: true
    config:
      tags:
        - api
        - exposure
        - misconfig
        - ssrf
        - redirect
      severity:
        - critical
        - high
        - medium

flags:
  origin_finder: true
  no_msf: true
  recursive_sub: true
  stealth_recon: false
  visual_recon: false
  interactsh: true
  smart_cpe_filter: true

rate_limit:
  nuclei_rate: 100
  nuclei_concurrency: 15
  nmap_timing: T3
  requests_per_second: 80
  delay_between_requests: "0"
  katana_max_urls: 20

requirements:
  critical:
    - nuclei
    - httpx
  important:
    - arjun
    - katana
  optional:
    - kiterunner
    - ffuf
    - sqlmap

