id: penlabs-cors-wildcard

info:
  name: CORS Wildcard with Credentials
  author: PenLabs
  severity: high
  description: |
    Detects dangerous CORS misconfiguration where the server reflects
    the Origin header or uses wildcard (*) while allowing credentials.
    This enables cross-origin data theft.
  tags: penlabs,misconfig,cors,vuln
  reference:
    - https://portswigger.net/web-security/cors

http:
  - method: GET
    path:
      - "{{BaseURL}}"
    headers:
      Origin: "https://evil.penlabs.attacker.com"

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "evil.penlabs.attacker.com"

      - type: word
        part: header
        words:
          - "Access-Control-Allow-Credentials"

    extractors:
      - type: kval
        kval:
          - access_control_allow_origin
          - access_control_allow_credentials

  - method: GET
    path:
      - "{{BaseURL}}"
    headers:
      Origin: "null"

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "null"
          - "Access-Control-Allow-Origin"
        condition: and

      - type: word
        part: header
        words:
          - "Access-Control-Allow-Credentials: true"
